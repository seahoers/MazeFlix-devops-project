name: CI

on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: mazeflix-frontend

jobs:
  verify:
    name: Verifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [audit, format, lint, typecheck, test]
        
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Audit dependencies
        if: matrix.check == 'audit'
        run: bun audit --prod --audit-level=critical

      - name: Install dependencies
        if: matrix.check != 'audit'
        run: bun install --frozen-lockfile

      - name: Check formatting
        if: matrix.check == 'format'
        run: bun run format:check

      - name: Run linting
        if: matrix.check == 'lint'
        run: bun run lint:ci

      - name: Run static type checking
        if: matrix.check == 'typecheck'
        run: bun run typecheck:ci

      - name: Run tests with coverage
        if: matrix.check == 'test'
        run: bun run test:ci

  build-and-push:
    name: Build and Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image tag output
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-apply:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        working-directory: terraform
        run: |
          mkdir -p "$HOME/.terraform-state/mazeflix-devops-project"
          terraform init -input=false -backend-config="path=$HOME/.terraform-state/mazeflix-devops-project/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_app_image_tag: ${{ needs.build-and-push.outputs.sha_tag }}
        run: terraform apply -input=false -auto-approve
