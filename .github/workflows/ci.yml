name: CI

on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: audit
          - workspace: frontend
            check: format:check
          - workspace: frontend
            check: lint:ci
          - workspace: frontend
            check: typecheck:ci
          - workspace: frontend
            check: test:ci
          - workspace: backend
            check: format:check
          - workspace: backend
            check: lint:ci
          - workspace: backend
            check: typecheck:ci
          - workspace: backend
            check: test:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Audit dependencies
        if: matrix.check == 'audit'
        run: bun audit --prod --audit-level=critical

      - name: Install dependencies
        if: matrix.check != 'audit'
        run: bun install --frozen-lockfile

      - name: Start Postgres
        if: matrix.workspace == 'backend' && matrix.check == 'test:ci'
        run: |
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_DB=mazeflix_test \
            -e POSTGRES_USER=mazeflix \
            -e POSTGRES_PASSWORD=mazeflix \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U mazeflix -d mazeflix_test && break
            sleep 1
          done

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'audit'
        working-directory: ${{ matrix.workspace }}
        env:
          DATABASE_URL: postgresql://mazeflix:mazeflix@localhost:5432/mazeflix_test
        run: bun run ${{ matrix.check }}

  terraform-test:
    name: Terraform Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform test
        working-directory: terraform
        run: terraform test

  build-and-push:
    name: Build and Push ${{ matrix.name }} Image
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            image: mazeflix-frontend
            dockerfile: frontend/Dockerfile
          - name: backend
            image: mazeflix-backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-apply:
    needs: [build-and-push, terraform-test]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag output
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        working-directory: terraform
        run: |
          mkdir -p "$HOME/.terraform-state/mazeflix-devops-project"
          terraform init -input=false -backend-config="path=$HOME/.terraform-state/mazeflix-devops-project/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_app_image_tag: ${{ steps.vars.outputs.sha_tag }}
          TF_VAR_backend_image_tag: ${{ steps.vars.outputs.sha_tag }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: terraform apply -input=false -auto-approve
